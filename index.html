<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c2a"><title>Stableford Buddy 4.2</title>
<link rel="manifest" href="manifest.webmanifest?v=4.2.0">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#17211c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#123c2a;color:#fff;padding:16px 14px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
h2{font-size:17px;margin:0 0 10px}.grid,.coursebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.coursebar .wide{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#53605a}
input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #c9d1cc;border-radius:9px;background:#fff}
button{border:0;border-radius:9px;padding:10px 12px;background:#17613f;color:#fff;font-weight:700}button.secondary{background:#e8eeeb;color:#173f2d}button.danger{background:#a52b2b}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.notice{font-size:12px;background:#edf5f0;border-radius:9px;padding:9px;margin-top:10px}
.hscroll{overflow-x:auto}.holes{display:grid;grid-template-columns:42px 58px 58px;gap:5px;min-width:180px}.holes>div{padding:6px;font-size:12px}.holes .head{font-weight:800;background:#edf1ee;border-radius:6px}
.player{border:1px solid #dbe1dd;border-radius:12px;padding:10px;margin-top:10px}.playerhead{display:grid;grid-template-columns:1fr 80px 34px;gap:7px;align-items:end}
.scores{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px}.scores input{padding:8px 2px;text-align:center}
.totals{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:8px}.pill{background:#edf5f0;border-radius:99px;padding:5px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #e1e5e2;text-align:left}
@media(min-width:650px){.coursebar{grid-template-columns:2fr 1fr 1fr 1fr}.scores{grid-template-columns:repeat(18,1fr)}}
</style></head><body>
<header><h1>Stableford Buddy</h1><small>Version 4.2 • Course editor fixed</small></header><main>

<section class="card"><h2>Course</h2>
<div class="coursebar">
<div class="wide"><label for="courseSelect">Saved course</label><select id="courseSelect"></select></div>
<div><label for="courseName">Course name</label><input id="courseName"></div>
<div><label for="tee">Tee</label><input id="tee"></div>
<div><label for="courseRating">Course Rating</label><input id="courseRating" type="number" step="0.1"></div>
<div><label for="slope">Slope</label><input id="slope" type="number" min="55" max="155"></div>
<div><label for="coursePar">Course Par</label><input id="coursePar" type="number" min="1" max="99"></div>
</div>
<div class="actions"><button id="newCourse">New Course</button><button id="saveCourse">Save as New Course</button>
<button id="updateCourse" class="secondary">Update Selected Course</button><button id="deleteCourse" class="danger">Delete Selected Course</button></div>
<div class="notice">Edit Course Par, Course Rating, Slope, and every hole below. Nevill Golf Club is pre-loaded.</div>
</section>

<section class="card"><h2>Hole details</h2><div class="hscroll"><div class="holes" id="holesEditor"></div></div></section>

<section class="card"><h2>Players & scoring</h2>
<div class="grid"><div><label for="allowance">Playing allowance</label><select id="allowance">
<option value="100">100%</option><option value="95">95%</option><option value="90">90%</option><option value="85">85%</option><option value="80">80%</option><option value="75">75%</option><option value="70">70%</option>
</select></div></div><div id="players"></div><div class="actions"><button id="addPlayer">Add Player</button></div></section>
<section class="card"><h2>Leaderboard</h2><div id="board"></div></section></main>

<script>
const $=id=>document.getElementById(id);
const COURSE_KEY='stableford_buddy_courses_v42',ROUND_KEY='stableford_buddy_round_v42',ALLOW_KEY='stableford_buddy_allowance_v42';
const nevill={id:'nevill',name:'Nevill Golf Club',tee:'White',cr:71.2,slope:125,par:70,holes:[[4,9],[5,13],[4,5],[3,15],[4,3],[3,11],[4,1],[4,7],[3,17],[5,18],[5,8],[3,16],[4,4],[4,6],[3,12],[4,2],[4,14],[4,7]]};
const clone=x=>JSON.parse(JSON.stringify(x));
let courses=loadCourses(),selectedId='nevill',currentCourse=clone(neville);
let state=loadRound();

function loadCourses(){try{let x=JSON.parse(localStorage.getItem(COURSE_KEY));if(Array.isArray(x)&&x.length){if(!x.some(c=>c.id==='nevill'))x.unshift(clone(neville));return x}}catch(e){}return[clone(neville)]}
function saveCourses(){localStorage.setItem(COURSE_KEY,JSON.stringify(courses))}
function loadRound(){try{let x=JSON.parse(localStorage.getItem(ROUND_KEY));if(x&&Array.isArray(x.players))return x}catch(e){}return{players:[{name:'Player 1',hi:0,scores:Array(18).fill('')}]}}
function saveRound(){localStorage.setItem(ROUND_KEY,JSON.stringify(state))}
function courseHcp(hi){return Math.round((+hi||0)*currentCourse.slope/113+(currentCourse.cr-currentCourse.par))}
function playingHcp(hi){return Math.round(courseHcp(hi)*(+$('allowance').value)/100)}
function strokes(ph,si){let n=Math.abs(ph),q=Math.floor(n/18),r=n%18,s=q+(si<=r?1:0);return ph>=0?s:-s}
function pts(g,p,s){if(g===''||!Number.isFinite(+g))return 0;let d=p-(+g-s);return d>=2?4:d===1?3:d===0?2:d===-1?1:0}
function total(p){let ph=playingHcp(p.hi),t=0;for(let i=0;i<18;i++)t+=pts(p.scores[i],currentCourse.holes[i][0],strokes(ph,currentCourse.holes[i][1]));return t}
function renderCourseSelect(){let s=$('courseSelect');s.innerHTML='';courses.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;if(c.id===selectedId)o.selected=true;s.appendChild(o)})}
function fill(c){$('courseName').value=c.name||'';$('tee').value=c.tee||'';$('courseRating').value=c.cr;$('slope').value=c.slope;$('coursePar').value=c.par}
function renderHoles(){let w=$('holesEditor');w.innerHTML='<div class="head">Hole</div><div class="head">Par</div><div class="head">SI</div>';currentCourse.holes.forEach((h,i)=>{w.innerHTML+='<div>'+(i+1)+'</div><div><input id="hp'+i+'" type="number" min="1" max="10" value="'+h[0]+'"></div><div><input id="si'+i+'" type="number" min="1" max="18" value="'+h[1]+'"></div>'})}
function readForm(){let c={id:selectedId,name:$('courseName').value.trim()||'Unnamed Course',tee:$('tee').value.trim(),cr:+$('courseRating').value||72,slope:+$('slope').value||113,par:+$('coursePar').value||72,holes:[]};for(let i=0;i<18;i++)c.holes.push([+$('hp'+i).value||4,+$('si'+i).value||i+1]);return c}
function renderAll(){renderPlayers();renderBoard()}
function selectCourse(id,clear=true){let c=courses.find(x=>x.id===id);if(!c)return;selectedId=id;currentCourse=clone(c);fill(currentCourse);renderHoles();if(clear)state.players.forEach(p=>p.scores=Array(18).fill(''));saveRound();renderAll();renderCourseSelect()}
function newCourse(){selectedId='__new__';currentCourse={id:'__new__',name:'New Course',tee:'',cr:72,slope:113,par:72,holes:Array.from({length:18},(_,i)=>[4,i+1])};fill(currentCourse);renderHoles();state.players.forEach(p=>p.scores=Array(18).fill(''));saveRound();renderAll();$('courseSelect').selectedIndex=-1}
function saveNew(){currentCourse=readForm();currentCourse.id='c_'+Date.now().toString(36);courses.push(clone(currentCourse));selectedId=currentCourse.id;saveCourses();renderCourseSelect();state.players.forEach(p=>p.scores=Array(18).fill(''));saveRound();renderAll();alert('Course saved.')}
function update(){if(selectedId==='__new__'){alert('Use Save as New Course first.');return}currentCourse=readForm();let i=courses.findIndex(c=>c.id===selectedId);if(i<0)return;courses[i]=clone(currentCourse);saveCourses();renderCourseSelect();renderAll();alert('Course updated.')}
function del(){if(selectedId==='nevill'){alert('Nevill Golf Club is the default course and cannot be deleted.');return}if(selectedId==='__new__'){selectCourse('nevill');return}if(!confirm('Delete this saved course?'))return;courses=courses.filter(c=>c.id!==selectedId);saveCourses();selectCourse('nevill')}
function renderPlayers(){let w=$('players');w.innerHTML='';state.players.forEach((p,pi)=>{let box=document.createElement('div');box.className='player';let head=document.createElement('div');head.className='playerhead';
let n=document.createElement('input');n.value=p.name;n.addEventListener('input',()=>{p.name=n.value;saveRound();renderBoard()});
let hi=document.createElement('input');hi.type='number';hi.step='.1';hi.value=p.hi;hi.addEventListener('change',()=>{p.hi=+hi.value||0;saveRound();renderPlayers();renderBoard()});
let x=document.createElement('button');x.textContent='×';x.className='danger';x.onclick=()=>{state.players.splice(pi,1);saveRound();renderAll()};head.append(n,hi,x);box.appendChild(head);
let t=document.createElement('div');t.className='totals';t.innerHTML='<span class="pill">Course Hcp: '+courseHcp(p.hi)+'</span><span class="pill">Playing Hcp: '+playingHcp(p.hi)+'</span><span class="pill">Stableford: '+total(p)+'</span>';box.appendChild(t);
let sc=document.createElement('div');sc.className='scores';for(let i=0;i<18;i++){let inp=document.createElement('input');inp.type='number';inp.min=1;inp.max=20;inp.placeholder='H'+(i+1);inp.value=p.scores[i];inp.addEventListener('change',()=>{p.scores[i]=inp.value;saveRound();renderAll()});sc.appendChild(inp)}box.appendChild(sc);w.appendChild(box)})}
function renderBoard(){let a=state.players.map(p=>({n:p.name||'Player',ph:playingHcp(p.hi),p:total(p)})).sort((x,y)=>y.p-x.p);$('board').innerHTML='<table><tr><th>Player</th><th>Playing Hcp</th><th>Stableford</th></tr>'+a.map(x=>'<tr><td>'+esc(x.n)+'</td><td>'+x.ph+'</td><td><b>'+x.p+'</b></td></tr>').join('')+'</table>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('courseSelect').onchange=e=>selectCourse(e.target.value);
$('newCourse').onclick=newCourse;$('saveCourse').onclick=saveNew;$('updateCourse').onclick=update;$('deleteCourse').onclick=del;
$('addPlayer').onclick=()=>{if(state.players.length<4){state.players.push({name:'Player '+(state.players.length+1),hi:0,scores:Array(18).fill('')});saveRound();renderAll()}};
$('allowance').value=localStorage.getItem(ALLOW_KEY)||'95';$('allowance').onchange=()=>{localStorage.setItem(ALLOW_KEY,$('allowance').value);renderAll()};
['courseName','tee','courseRating','slope','coursePar'].forEach(id=>$(id).addEventListener('change',()=>{currentCourse=readForm();renderHoles();renderAll()}));
renderCourseSelect();selectCourse('nevill',false);
</script></body></html>
