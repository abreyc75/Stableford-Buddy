<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a"><link rel="manifest" href="./manifest.webmanifest?v=4.0.0">
<title>Stableford Buddy v4</title>
<style>
:root{--g:#0b6b3a;--bg:#f3f7f4;--bd:#d7e1da}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#17221b}
header{background:var(--g);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:2}
h1{font-size:21px;margin:0}.v{font-size:12px;opacity:.8}.ct{font-size:13px;opacity:.9}
.wrap{max-width:1100px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:16px;margin:0 0 9px}.grid,.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{font-size:12px;font-weight:700;color:#536158}input{width:100%;padding:8px;border:1px solid #c8d4cc;border-radius:9px}
button{font:inherit;border:0;border-radius:9px;padding:8px 11px;background:var(--g);color:#fff;font-weight:700}
button.secondary{background:#e8efea;color:#173524}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tab{white-space:nowrap;background:#e5eee8;color:#173524}.tab.active{background:var(--g);color:#fff}
.tableWrap{overflow-x:auto}.scoreTable{width:100%;border-collapse:collapse;min-width:680px}
.scoreTable th,.scoreTable td{border-bottom:1px solid var(--bd);padding:7px;text-align:center}.scoreTable th{background:#eef4ef;font-size:12px}
.scoreTable td:first-child,.scoreTable th:first-child{text-align:left}.scoreTable input{width:55px;text-align:center}
.total{font-size:18px;font-weight:800}.leader{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.muted{font-size:12px;color:#68756d}
.badge{display:inline-block;background:#e8efea;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;margin:2px}
@media(max-width:700px){.grid,.players{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>🏌️ Stableford Buddy <span class="v">v4</span></h1><div class="ct">Nevill Golf Club · White Tee · Par 70 · CR 71.2 · Slope 125</div></header>
<div class="wrap">
<div class="card"><h2>Players</h2><div class="players" id="players"></div></div>
<div class="card"><h2>Course</h2><span class="badge">Nevill Golf Club</span><span class="badge">White Tee</span><span class="badge">Par 70</span><span class="badge">CR 71.2</span><span class="badge">Slope 125</span><span class="badge">95% allowance</span>
<div class="actions"><button class="secondary" onclick="newRound()">New Round / Clear Scores</button><button class="secondary" onclick="resetPlayers()">Reset Players</button></div></div>
<div class="card"><h2>18-hole scorecard</h2><div class="tabs" id="tabs"></div><div id="scoreArea"></div></div>
<div class="card"><h2>Leaderboard</h2><div id="leaderboard"></div></div>
<div class="card muted"><strong>Stableford Buddy v4</strong> · Customised for Nevill Golf Club White Tee. No round history is stored.</div>
</div>
<script>
const VERSION="4.0.0",KEY="stableford_buddy_nevill_v4";
const COURSE={name:"Nevill Golf Club",tee:"White",cr:71.2,slope:125,par:70,allowance:95,holes:[{"par": 4, "si": 9}, {"par": 5, "si": 13}, {"par": 4, "si": 5}, {"par": 3, "si": 15}, {"par": 4, "si": 3}, {"par": 3, "si": 11}, {"par": 4, "si": 1}, {"par": 4, "si": 7}, {"par": 3, "si": 17}, {"par": 5, "si": 18}, {"par": 5, "si": 8}, {"par": 3, "si": 16}, {"par": 4, "si": 4}, {"par": 4, "si": 6}, {"par": 3, "si": 12}, {"par": 4, "si": 2}, {"par": 4, "si": 14}, {"par": 4, "si": 7}]};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{players:[{name:"Player 1",hi:18},{name:"Player 2",hi:18},{name:"Player 3",hi:18},{name:"Player 4",hi:18}],active:0,scores:Array.from({length:4},()=>Array(18).fill(""))};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function renderPlayers(){players.innerHTML=state.players.map((p,i)=>`<div><label>Player ${i+1}</label><input value="${esc(p.name)}" oninput="state.players[${i}].name=this.value;save();renderTabs();renderLeaderboard()"><label>Handicap Index</label><input type="number" step=".1" value="${p.hi}" oninput="state.players[${i}].hi=parseFloat(this.value)||0;save();renderScore();renderLeaderboard()"></div>`).join("")}
function renderTabs(){tabs.innerHTML=state.players.map((p,i)=>`<button class="tab ${i===state.active?"active":""}" onclick="state.active=${i};save();renderTabs();renderScore()">${esc(p.name||"Player "+(i+1))}</button>`).join("")}
function ch(hi){return Math.round(hi*COURSE.slope/113+(COURSE.cr-COURSE.par))}
function ph(hi){return Math.round(ch(hi)*COURSE.allowance/100)}
function strokes(h,si){if(h>=0){let q=Math.floor(h/18),r=h%18;return q+(si<=r?1:0)}let n=-h,q=Math.floor(n/18),r=n%18;return -(q+(si<=r?1:0))}
function pts(par,net){let d=par-net;return d>=2?4:d===1?3:d===0?2:d===-1?1:0}
function renderScore(){let p=state.players[state.active],hand=ph(p.hi),total=0,rows="";for(let i=0;i<18;i++){let h=COURSE.holes[i],g=Number(state.scores[state.active][i]),has=g>0,s=strokes(hand,h.si),n=has?g-s:"",pt=has?pts(h.par,n):0;if(has)total+=pt;rows+=`<tr><td>Hole ${i+1}</td><td>${h.par}</td><td>${h.si}</td><td><input type="number" min="1" max="20" inputmode="numeric" value="${has?g:""}" oninput="setScore(${i},this.value)"></td><td>${has?s:"–"}</td><td>${has?n:"–"}</td><td><b>${has?pt:"–"}</b></td></tr>`}
scoreArea.innerHTML=`<div class="grid"><div><span class="muted">Course Hcap</span><div class="total">${ch(p.hi)}</div></div><div><span class="muted">Playing Hcap</span><div class="total">${hand}</div></div><div><span class="muted">Stableford</span><div class="total">${total}</div></div><div><span class="muted">Player</span><div class="total">${esc(p.name)}</div></div></div><div class="tableWrap"><table class="scoreTable"><thead><tr><th>Hole</th><th>Par</th><th>SI</th><th>Gross</th><th>Strokes</th><th>Net</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions"><button class="secondary" onclick="clearPlayer()">Clear ${esc(p.name)}</button></div>`}
function setScore(i,v){state.scores[state.active][i]=v;save();renderScore();renderLeaderboard()}
function clearPlayer(){state.scores[state.active]=Array(18).fill("");save();renderScore();renderLeaderboard()}
function newRound(){state.scores=Array.from({length:4},()=>Array(18).fill(""));state.active=0;save();renderTabs();renderScore();renderLeaderboard()}
function resetPlayers(){state.players=[{name:"Player 1",hi:18},{name:"Player 2",hi:18},{name:"Player 3",hi:18},{name:"Player 4",hi:18}];save();renderPlayers();renderTabs();renderScore();renderLeaderboard()}
function total(i){let t=0,h=ph(state.players[i].hi);for(let j=0;j<18;j++){let g=Number(state.scores[i][j]);if(g>0){let x=COURSE.holes[j];t+=pts(x.par,g-strokes(h,x.si))}}return t}
function renderLeaderboard(){leaderboard.innerHTML=state.players.map((p,i)=>({name:p.name||"Player "+(i+1),pts:total(i)})).sort((a,b)=>b.pts-a.pts).map((x,n)=>`<div class="leader"><span>${n+1}. ${esc(x.name)}</span><b>${x.pts} pts</b></div>`).join("")}
renderPlayers();renderTabs();renderScore();renderLeaderboard();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v="+VERSION));
</script></body></html>
